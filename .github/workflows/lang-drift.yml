name: lang-drift

# The generated parsers must match tricc_oo/lang/ (feature/20261125-expression-languages.md §1.9).
on:
  pull_request:
    paths:
      - "tricc_oo/lang/**"
      - "tricc_oo/converters/cql/**"
      - "tricc_oo/converters/feel/**"
      - "scripts/generate-lang-parsers.sh"
      - ".github/workflows/lang-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ANTLR tool
        run: pip install antlr4-tools==0.2.1
      - name: Regenerate and compare
        run: ANTLR=antlr4 scripts/generate-lang-parsers.sh --check
