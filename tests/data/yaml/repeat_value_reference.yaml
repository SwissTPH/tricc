# Two capture slots of one concept, read back per slot with GetRepeatedValue.
# Covers feature/20260821-get-repeated-value-operation.md
id: repeat_value_reference
title: Repeat value reference
process: main

nodes:
  - id: start
    type: start
    label: "Start"
    name: start_repeat_value_reference
    form_id: repeat_value_reference

  - id: w1
    type: integer
    name: weight
    label: "Weight at triage"
    repeat: 1
    required: true

  - id: w2
    type: integer
    name: weight
    label: "Weight after treatment"
    repeat: 2
    required: true

  - id: calc_delta
    type: calculate
    name: weight_delta
    label: "Weight delta"
    calculate: 'GetRepeatedValue("weight", 2) - GetRepeatedValue("weight", 1)'

  - id: end
    type: end
    label: "End"
    name: end_repeat_value_reference

edges:
  - source: start
    target: w1
  - source: w1
    target: w2
  - source: w2
    target: calc_delta
  - source: calc_delta
    target: end
