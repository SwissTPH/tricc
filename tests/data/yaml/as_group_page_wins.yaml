# page: true implies a section: with asGroup: false on the same block call or group, a warning
# is logged and the page is kept (feature/20261120-questionnaire-pages.md, rev. 2026-11-20).

id: main_page
title: "Main"
process: main

groups:
  - id: g_page
    name: page_frame
    label: "Page frame"
    page: true
    asGroup: false

nodes:
  - id: start
    type: start
    form_id: as_group_page_wins
    label: "Start"
    name: start_main

  - id: q0
    type: integer
    name: q0
    label: "Before"

  - id: call_m
    type: block
    name: call_m
    label: "Measure"
    link: measure
    page: true
    asGroup: false

  - id: q1
    type: integer
    name: q1
    label: "Framed"
    group: g_page

  - id: end
    type: end
    label: "End"
    name: end_main

edges:
  - source: start
    target: q0
  - source: q0
    target: call_m
  - source: call_m
    target: q1
  - source: q1
    target: end

---
id: measure
name: measure
title: "Measure"
nodes:
  - id: m_start
    type: block_start
    name: measure

  - id: m_temp
    type: decimal
    name: m_temp
    label: "Temperature"

  - id: m_end
    type: activity_end

edges:
  - source: m_start
    target: m_temp
  - source: m_temp
    target: m_end
