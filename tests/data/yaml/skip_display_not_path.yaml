process: same_page

nodes:
  - id: s3
    type: activity_start
    label: Start 3
    name: skip_same_page

  - id: w1
    type: integer
    name: recapture_w
    label: Weight slot 1
    repeat: 1
    required: true

  - id: w2
    type: integer
    name: recapture_w
    label: Weight slot 2
    repeat: 2
    required: true

  - id: e3
    type: end
    label: End

edges:
  - source: s3
    target: w1
  - source: w1
    target: w2
  - source: w2
    target: e3

---
id: skip_local
title: Local-only recapture
process: local

nodes:
  - id: s4
    type: activity_start
    label: Start 4
    name: skip_local

  - id: loc1
    type: integer
    name: local_w
    label: Local 1
    repeat: -1
    required: true

  - id: loc2
    type: integer
    name: local_w
    label: Local 2
    repeat: -1
    required: true

  - id: e4
    type: end
    label: End

edges:
  - source: s4
    target: loc1
  - source: loc1
    target: loc2
  - source: loc2
    target: e4
